name: Refresh listings

on:
  schedule:
    - cron: "0 22 * * *" # 6:00 AM PHT daily (SPEC §13)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Refresh listings
        id: refresh
        # Below the job limit on purpose: a step timeout fails the step instead of
        # cancelling the job, so the commit step below still saves a recorded block.
        timeout-minutes: 50
        run: |
          set -o pipefail
          pnpm refresh | tee refresh.log
          {
            echo "## Refresh result"
            echo
            grep -E "^(registry:|run summary:|zero-PH boards|  FAIL|  SKIP.*(BLOCKED|halted)|  TRACKER-ISSUE)" refresh.log || true
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Validate generated site
        id: validate
        run: |
          pnpm format:check
          pnpm typecheck
          pnpm --filter web lint
          pnpm test
          pnpm --filter web build
      - name: Commit & push if data changed
        # Runs even when the refresh or validation failed: the pipeline writes
        # data/fetch-state.json the moment it records a block, and that block MUST
        # persist, or the next run would request the blocked tenant again (SPEC
        # §17.1.2). The job still fails, and unvalidated listings/README are never
        # published.
        if: ${{ !cancelled() }}
        env:
          VALIDATED: ${{ steps.refresh.outcome == 'success' && steps.validate.outcome == 'success' }}
        run: |
          if [ "$VALIDATED" = "true" ]; then
            paths="data/ README.md"
            message="data: daily refresh"
          else
            git checkout -- data/listings.json README.md
            paths="data/fetch-state.json"
            message="data: keep fetch state (validation failed)"
          fi
          if git diff --quiet -- $paths; then
            echo "$paths unchanged — nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add $paths
          git commit -m "$message"
          # main may have moved during the run; only generated files are committed.
          git pull --rebase
          git push
