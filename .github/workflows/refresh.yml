name: Refresh listings

on:
  schedule:
    - cron: "0 22 * * *" # 6:00 AM PHT daily (SPEC §13)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Refresh listings
        run: |
          set -o pipefail
          pnpm refresh | tee refresh.log
          {
            echo "## Refresh result"
            echo
            grep -E "^(registry:|run summary:|zero-PH boards|  FAIL|  SKIP.*(BLOCKED|halted)|  TRACKER-ISSUE)" refresh.log || true
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Validate generated site
        run: |
          pnpm format:check
          pnpm typecheck
          pnpm --filter web lint
          pnpm test
          pnpm --filter web build
      - name: Commit & push if data changed
        run: |
          # data/ includes fetch-state.json: a recorded block MUST persist, or the
          # next run would request the blocked tenant again (SPEC §17.1.2).
          if git diff --quiet -- data/ README.md; then
            echo "data/ and README.md unchanged — nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ README.md
          git commit -m "data: daily refresh"
          # main may have moved during the run; only generated files are committed.
          git pull --rebase
          git push
