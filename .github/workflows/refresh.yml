name: Refresh listings

on:
  schedule:
    - cron: "0 22 * * *" # 6:00 AM PHT daily (SPEC §13)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm refresh
      - name: Commit & push if data changed
        run: |
          if git diff --quiet -- data/listings.json README.md; then
            echo "data/listings.json and README.md unchanged — nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ README.md
          git commit -m "data: daily refresh"
          git push
