name: Report a listing
description: Flag a closed, inaccurate, or suspicious listing in SimplifyTrabaho.
title: "[Listing]: "
labels: [data-quality]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping keep the directory trustworthy. Do not include recruiter details, application data, or other personal information.
  - type: dropdown
    id: problem
    attributes:
      label: What is wrong?
      options:
        - The official application link is closed or broken
        - The role is not located in or open to the Philippines
        - The company or role facts are inaccurate
        - The listing looks duplicated
        - Something else
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: Official application URL
      placeholder: https://company-ats.example/job/123
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: What did you observe?
      description: Include the exact error or incorrect fact. Do not paste a job description.
      placeholder: The official page now says this role is no longer available.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I did not include personal information or job-description text.
          required: true
